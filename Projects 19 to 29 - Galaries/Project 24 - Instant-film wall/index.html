  <header>
    <div class="masthead">
      <div>
        <h1>Project 24 - Polaroid Tilt Grid</h1>
        <p class="dek">
          A playful, “instant-film” gallery layout. Each card has a subtle tilt; when you hover, the photo lifts,
          straightens,
          and reveals a caption overlay from the bottom. No JavaScript used.
        </p>
      </div>
    </div>

    <nav class="menu" aria-label="Sample menu">
      <a href="#">All</a>
      <a href="#">People</a>
      <a href="#">Places</a>
      <a href="#">Objects</a>
      <a href="#">Monochrome</a>
      <a href="#">Favorites</a>
    </nav>
  </header>

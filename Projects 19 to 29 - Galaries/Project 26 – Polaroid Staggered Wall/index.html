<!DOCTYPE html>

<head>

  <title>Gallery</title>
  <link rel="stylesheet" href="styles.css">

<body>
  <header>
    <div class="masthead">
      <div>
        <h1>Project 26 - Polaroid Staggered Wall</h1>
        <p class="dek">
          Masonry wall with Polaroid-styled prints and gentle, randomized tilts.
          Hover a print to straighten it and reveal the info strip (overlay is hidden unless hovered).
        </p>
      </div>
    </div>

    <nav class="pills" aria-label="Sample filters (decorative)">
      <a href="#">All</a>
      <a href="#">People</a>
      <a href="#">Places</a>
      <a href="#">Objects</a>
      <a href="#">Black & White</a>
      <a href="#">Color</a>
    </nav>
  </header>
